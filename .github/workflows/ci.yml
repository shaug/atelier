name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install --requirement requirements.txt
      - run: python3 scripts/validate_repository.py
      - run: python3 -m compileall -q scripts contract_tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install --requirement requirements.txt
      - run: python3 -m unittest discover -s contract_tests -v
      - run: python3 experiments/mailbox_protocol_v0.py
